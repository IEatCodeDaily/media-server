version: "3"

# .env file should contain:
# STORAGE_TYPE=smb|local (choose one)
# If STORAGE_TYPE=local, then:
#   LOCAL_MEDIA_DIRECTORY=/path/to/media
# If STORAGE_TYPE=smb, then:
#   SMB_USER=username
#   SMB_PASSWORD=password
#   SMB_SERVER=server
#   SMB_SHARE=Media (or your share name)

services:

#============ Reverse Proxy ================
  traefik:
    image: traefik:v3.0
    container_name: traefik
    domainname: ${DOMAIN_NAME}
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # - "--log.level=DEBUG"
    ports:
      # The Web UI (enabled by --api.insecure=true in traefik.toml)
      - 8080:8080
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    profiles:
      - core

#============ Dashboard ================

  homarr:
    container_name: homarr
    image: ghcr.io/ajnart/homarr:latest
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homarr.rule=Host(`${DOMAIN_NAME}`) || Host(`homarr.${DOMAIN_NAME}`)"
      - "traefik.http.services.homarr.loadbalancer.server.port=7575"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VERSION=docker
      - NODE_TLS_REJECT_UNAUTHORIZE=0
      - BASE_URL=${DOMAIN_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - ${CONFIG_DIRECTORY}/config/homarr/configs:/app/data/configs
      - ${CONFIG_DIRECTORY}/config/homarr/icons:/app/public/icons
      - ${CONFIG_DIRECTORY}/config/homarr/data:/data
    profiles:
      - homarr
    ports:
      - 7575:7575

  organizr:
    container_name: organizr
    hostname: organizr
    image: organizr/organizr:latest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.organizr.rule=Host(`${DOMAIN_NAME}`) || Host(`organizr.${DOMAIN_NAME}`)"
      - "traefik.http.services.organizr.loadbalancer.server.port=80"
    volumes:
      - ${CONFIG_DIRECTORY}/config/organizr/configs:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - 81:80
    profiles:
      - organizr
    restart: unless-stopped

#============ Media Service ================

  jellyfin:
    image: lscr.io/linuxserver/jellyfin
    container_name: jellyfin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN_NAME}`)"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      # - "traefik.http.routers.jellyfin.tls=true"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
    volumes:
      - ${CONFIG_DIRECTORY}/config/jellyfin:/config
      # Media volumes are conditionally included based on the profile
    profiles:
      - jellyfin
      - jellyfin-smb
      - jellyfin-local
    restart: unless-stopped
    ports: 
      - 8096:8096

  # Extended Jellyfin service with SMB volumes
  jellyfin-smb-volumes:
    extends:
      service: jellyfin
    volumes:
      - ${CONFIG_DIRECTORY}/config/jellyfin:/config
      - smb-movies:/data/movies
      - smb-tvshows:/data/tvshows
      - smb-music:/data/music
      - smb-photos:/data/photos
    profiles:
      - jellyfin-smb

  # Extended Jellyfin service with local volumes
  jellyfin-local-volumes:
    extends:
      service: jellyfin
    volumes:
      - ${CONFIG_DIRECTORY}/config/jellyfin:/config
      - ${LOCAL_MEDIA_DIRECTORY}/movies:/data/movies
      - ${LOCAL_MEDIA_DIRECTORY}/tvshows:/data/tvshows
      - ${LOCAL_MEDIA_DIRECTORY}/music:/data/music
      - ${LOCAL_MEDIA_DIRECTORY}/photos:/data/photos
    profiles:
      - jellyfin-local

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.${DOMAIN_NAME}`)"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
    environment:
      # - LOG_LEVEL=debug
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIRECTORY}/config/jellyseerr:/app/config
    ports:
      - 5055:5055
    profiles:
      - jellyfin
      - jellyfin-smb
      - jellyfin-local
    restart: unless-stopped

  plex:
    image: plexinc/pms-docker
    container_name: plex
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`plex.${DOMAIN_NAME}`)"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIRECTORY}/config/plex:/config
    ports:
      - 32400:32400
    profiles:
      - plex
      - plex-smb
      - plex-local
    restart: unless-stopped

  # Extended Plex service with SMB volumes
  plex-smb-volumes:
    extends:
      service: plex
    volumes:
      - ${CONFIG_DIRECTORY}/config/plex:/config
      - smb-movies:/data/movies
      - smb-tvshows:/data/tvshows
      - smb-music:/data/music
      - smb-photos:/data/photos
    profiles:
      - plex-smb

  # Extended Plex service with local volumes
  plex-local-volumes:
    extends:
      service: plex
    volumes:
      - ${CONFIG_DIRECTORY}/config/plex:/config
      - ${LOCAL_MEDIA_DIRECTORY}/movies:/data/movies
      - ${LOCAL_MEDIA_DIRECTORY}/tvshows:/data/tvshows
      - ${LOCAL_MEDIA_DIRECTORY}/music:/data/music
      - ${LOCAL_MEDIA_DIRECTORY}/photos:/data/photos
    profiles:
      - plex-local

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.overseerr.rule=Host(`overseerr.${DOMAIN_NAME}`)"
      - "traefik.http.services.overseerr.loadbalancer.server.port=5055"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIRECTORY}/config/overseerr:/config
    ports:
      - 5055:5055
    profiles:
      - plex
      - plex-smb
      - plex-local
    restart: unless-stopped

#============ Download Client ================

  # qBitorrent is used to download torrents
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:4.6.0
    container_name: qbittorrent
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN_NAME}`)"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_DIRECTORY}/config/qbittorrent:/config
    restart: unless-stopped
    ports:
      - 8081:8080
    profiles:
      - qbittorrent
      - qbittorrent-smb
      - qbittorrent-local

  # Extended qBittorrent service with SMB volumes
  qbittorrent-smb-volumes:
    extends:
      service: qbittorrent
    volumes:
      - ${CONFIG_DIRECTORY}/config/qbittorrent:/config
      - smb-downloads:/downloads
    profiles:
      - qbittorrent-smb

  # Extended qBittorrent service with local volumes
  qbittorrent-local-volumes:
    extends:
      service: qbittorrent
    volumes:
      - ${CONFIG_DIRECTORY}/config/qbittorrent:/config
      - ${LOCAL_MEDIA_DIRECTORY}/downloads:/downloads
    profiles:
      - qbittorrent-local

  # Transmission is used to download torrents
  transmission:
    image: lscr.io/linuxserver/transmission
    container_name: transmission
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`transmission.${DOMAIN_NAME}`)"
      - "traefik.http.services.transmission.loadbalancer.server.port=9091"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIRECTORY}/config/transmission:/config
    ports:
      - 9091:9091
    profiles:
      - transmission
      - transmission-smb
      - transmission-local
    restart: unless-stopped

  # Extended transmission service with SMB volumes
  transmission-smb-volumes:
    extends:
      service: transmission
    volumes:
      - ${CONFIG_DIRECTORY}/config/transmission:/config
      - smb-downloads:/downloads
    profiles:
      - transmission-smb

  # Extended transmission service with local volumes
  transmission-local-volumes:
    extends:
      service: transmission
    volumes:
      - ${CONFIG_DIRECTORY}/config/transmission:/config
      - ${LOCAL_MEDIA_DIRECTORY}/downloads:/downloads
    profiles:
      - transmission-local

#============ Media Management ================

  # Sonarr is used to query, add downloads to the download queue and index TV shows
  # https://sonarr.tv/
  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN_NAME}`)"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIRECTORY}/config/sonarr:/config
    ports:
      - 8989:8989
    profiles:
      - sonarr
      - sonarr-smb
      - sonarr-local
    restart: unless-stopped

  # Extended sonarr service with SMB volumes
  sonarr-smb-volumes:
    extends:
      service: sonarr
    volumes:
      - ${CONFIG_DIRECTORY}/config/sonarr:/config
      - smb-tvshows:/tv
      - smb-downloads:/downloads
    profiles:
      - sonarr-smb

  # Extended sonarr service with local volumes
  sonarr-local-volumes:
    extends:
      service: sonarr
    volumes:
      - ${CONFIG_DIRECTORY}/config/sonarr:/config
      - ${LOCAL_MEDIA_DIRECTORY}/tvshows:/tv
      - ${LOCAL_MEDIA_DIRECTORY}/downloads:/downloads
    profiles:
      - sonarr-local

  # Radarr is used to query, add downloads to the download queue and index Movies
  # https://radarr.video/
  radarr:
    image: lscr.io/linuxserver/radarr
    container_name: radarr
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN_NAME}`)"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIRECTORY}/config/radarr:/config
    ports:
      - 7878:7878
    profiles:
      - radarr
      - radarr-smb
      - radarr-local
    restart: unless-stopped

  # Extended radarr service with SMB volumes
  radarr-smb-volumes:
    extends:
      service: radarr
    volumes:
      - ${CONFIG_DIRECTORY}/config/radarr:/config
      - smb-movies:/movies
      - smb-downloads:/downloads
    profiles:
      - radarr-smb

  # Extended radarr service with local volumes
  radarr-local-volumes:
    extends:
      service: radarr
    volumes:
      - ${CONFIG_DIRECTORY}/config/radarr:/config
      - ${LOCAL_MEDIA_DIRECTORY}/movies:/movies
      - ${LOCAL_MEDIA_DIRECTORY}/downloads:/downloads
    profiles:
      - radarr-local

  # Lidarr is used to query, add downloads to the download queue and index Music
  # https://lidarr.audio/
  lidarr:
    image: lscr.io/linuxserver/lidarr
    container_name: lidarr
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.${DOMAIN_NAME}`)"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIRECTORY}/config/lidarr:/config
    ports:
      - 8686:8686
    profiles:
      - lidarr
      - lidarr-smb
      - lidarr-local
    restart: unless-stopped

  # Extended lidarr service with SMB volumes
  lidarr-smb-volumes:
    extends:
      service: lidarr
    volumes:
      - ${CONFIG_DIRECTORY}/config/lidarr:/config
      - smb-music:/music
      - smb-downloads:/downloads
    profiles:
      - lidarr-smb

  # Extended lidarr service with local volumes
  lidarr-local-volumes:
    extends:
      service: lidarr
    volumes:
      - ${CONFIG_DIRECTORY}/config/lidarr:/config
      - ${LOCAL_MEDIA_DIRECTORY}/music:/music
      - ${LOCAL_MEDIA_DIRECTORY}/downloads:/downloads
    profiles:
      - lidarr-local

  # Readarr is used to query, add downloads to the download queue and index Audio and Ebooks
  # https://readarr.com/
  readarr:
    image: lscr.io/linuxserver/readarr:develop
    container_name: readarr
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.readarr.rule=Host(`readarr.${DOMAIN_NAME}`)"
      - "traefik.http.services.readarr.loadbalancer.server.port=8787"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIRECTORY}/config/readarr:/config
    ports:
      - 8787:8787
    profiles:
      - readarr
      - readarr-smb
      - readarr-local
    restart: unless-stopped

  # Extended readarr service with SMB volumes
  readarr-smb-volumes:
    extends:
      service: readarr
    volumes:
      - ${CONFIG_DIRECTORY}/config/readarr:/config
      - smb-books:/books
      - smb-downloads:/downloads
    profiles:
      - readarr-smb

  # Extended readarr service with local volumes
  readarr-local-volumes:
    extends:
      service: readarr
    volumes:
      - ${CONFIG_DIRECTORY}/config/readarr:/config
      - ${LOCAL_MEDIA_DIRECTORY}/books:/books
      - ${LOCAL_MEDIA_DIRECTORY}/downloads:/downloads
    profiles:
      - readarr-local

  # Bazarr is used to download and categorize subtitles
  # https://www.bazarr.media/
  bazarr:
    image: lscr.io/linuxserver/bazarr
    container_name: bazarr
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN_NAME}`)"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIRECTORY}/config/bazarr:/config
    ports:
      - 6767:6767
    profiles:
      - bazarr
      - bazarr-smb
      - bazarr-local
    restart: unless-stopped

  # Extended bazarr service with SMB volumes
  bazarr-smb-volumes:
    extends:
      service: bazarr
    volumes:
      - ${CONFIG_DIRECTORY}/config/bazarr:/config
      - smb-movies:/movies
      - smb-tvshows:/tv
    profiles:
      - bazarr-smb

  # Extended bazarr service with local volumes
  bazarr-local-volumes:
    extends:
      service: bazarr
    volumes:
      - ${CONFIG_DIRECTORY}/config/bazarr:/config
      - ${LOCAL_MEDIA_DIRECTORY}/movies:/movies
      - ${LOCAL_MEDIA_DIRECTORY}/tvshows:/tv
    profiles:
      - bazarr-local

  # Prowlarr is our torrent indexer/searcher. Sonarr/Radarr use Prowlarr as a source
  # https://prowlarr.com/
  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN_NAME}`)"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIRECTORY}/config/prowlarr:/config
    ports:
      - 9696:9696
    profiles:
      - prowlarr
    restart: unless-stopped

  # Recyclarr is used to sync profiles
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr
    container_name: recyclarr
    user: ${PUID}:${PGID}
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIRECTORY}/config/recyclarr:/config
    profiles:
      - recyclarr
    restart: unless-stopped

#============ Network ================

  # Gluetun is a VPN client that can be used to route all traffic through a VPN
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8888:8888/tcp # HTTP proxy
      - 8388:8388/tcp # Shadowsocks
      - 8388:8388/udp # Shadowsocks
      #- 8080:8080/tcp # gluetun
    volumes:
      - ${CONFIG_DIRECTORY}/config/gluetun:/config
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE}
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${VPN_USER}
      - OPENVPN_PASSWORD=${VPN_PASSWORD}
      - OPENVPN_CIPHERS=AES-256-GCM
    profiles:
      - gluetun
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr
    container_name: flaresolverr
    ports:
      - 8191:8191
    profiles:
      - flaresolverr
    restart: unless-stopped

#============ Other Services ================

  # Watchtower is going to keep our instances updated
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    environment:
      - WATCHTOWER_CLEANUP=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - core
    restart: unless-stopped
    
  # Portainer is a web interface for managing docker
  portainer:
    container_name: portainer
    image: portainer/portainer-ce
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN_NAME}`)"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CONFIG_DIRECTORY}/config/portainer:/data
    restart: unless-stopped
    profiles:
      - portainer
    ports:
      - 9000:9000

volumes:
  smb-movies:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,uid=${PUID},gid=${PGID},file_mode=0755,dir_mode=0755"
      device: "//${SMB_SERVER}/${SMB_SHARE:-Media}/movies"
      
  smb-tvshows:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,uid=${PUID},gid=${PGID},file_mode=0755,dir_mode=0755"
      device: "//${SMB_SERVER}/${SMB_SHARE:-Media}/tvshows"
      
  smb-music:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,uid=${PUID},gid=${PGID},file_mode=0755,dir_mode=0755"
      device: "//${SMB_SERVER}/${SMB_SHARE:-Media}/music"
      
  smb-photos:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,uid=${PUID},gid=${PGID},file_mode=0755,dir_mode=0755"
      device: "//${SMB_SERVER}/${SMB_SHARE:-Media}/photos"
      
  smb-books:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,uid=${PUID},gid=${PGID},file_mode=0755,dir_mode=0755"
      device: "//${SMB_SERVER}/${SMB_SHARE:-Media}/books"
      
  smb-downloads:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${SMB_USER},password=${SMB_PASSWORD},vers=3.0,uid=${PUID},gid=${PGID},file_mode=0755,dir_mode=0755"
      device: "//${SMB_SERVER}/${SMB_SHARE:-Media}/downloads"
